<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="/CSS/game1.css">
</head>

<body>

    <h1>Tic-Tac-Toe Game</h1>
    <hr>
    <br>
    <div id="game-board">
        <div class="game-cell" data-cell-index="0"></div>
        <div class="game-cell" data-cell-index="1"></div>
        <div class="game-cell" data-cell-index="2"></div>
        <div class="game-cell" data-cell-index="3"></div>
        <div class="game-cell" data-cell-index="4"></div>
        <div class="game-cell" data-cell-index="5"></div>
        <div class="game-cell" data-cell-index="6"></div>
        <div class="game-cell" data-cell-index="7"></div>
        <div class="game-cell" data-cell-index="8"></div>
    </div>

    <h2 id="result" class="winner-message"></h2>

    <div id="exitMessage" class="exit-message">

        <p>Do you want to exit the game?</p>

        <button onclick="exitGame()">Yes</button>

        <button onclick="cancelExit()">No</button>

    </div>


    <button id="game-restart-button" onclick="restartGame()">Restart Game</button>
    
    <script src="/Javascript/game1.js"></script>

</body>

</html>
